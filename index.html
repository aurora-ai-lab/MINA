<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coolcat · AI 艺术作品与提示词</title>
  <meta name="description" content="Coolcat（@aicoolcat）的 AI 艺术作品集：每一张图都附带完整提示词。AI art & prompts.">
  <meta name="theme-color" content="#07050d">
  <meta property="og:title" content="Coolcat · AI 艺术作品与提示词">
  <meta property="og:description" content="AI art & prompts by @aicoolcat">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Coolcat 首页">
        <span class="wordmark">Coolcat</span>
        <span class="brand-sub">
          <span class="tagline">AI 艺术作品与提示词</span>
          <span class="tagline-en">AI art &amp; prompts</span>
        </span>
      </a>
      <a class="x-link" href="https://x.com/aicoolcat" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <span>@aicoolcat</span>
      </a>
    </div>
  </header>

  <section class="hero-stage" id="hero-stage" aria-labelledby="hero-title">
    <canvas id="hero-canvas" aria-hidden="true"></canvas>
    <div class="hero-planet" aria-hidden="true"></div>
    <div class="hero-copy">
      <span class="eyebrow">COOLCAT / DIGITAL EXPERIENCE</span>
      <h1 id="hero-title">把想法变成一个<br><em>会动的世界</em></h1>
      <p>选择网站方向，浏览视觉案例、动效系统与 AI 构建提示词。</p>
      <div class="hero-actions">
        <a class="hero-primary" href="#direction-title">选择网站类型 <span>↓</span></a>
        <a class="hero-secondary" href="#grid">浏览作品</a>
      </div>
    </div>
    <button class="hero-motion" id="hero-motion" type="button" aria-pressed="false">暂停动效</button>
  </section>

  <section class="direction-picker" aria-labelledby="direction-title">
    <div class="direction-copy">
      <span class="eyebrow">WEBSITE DIRECTION</span>
      <h2 id="direction-title">选择你想打造的网站类型</h2>
      <p>先确定视觉方向，再浏览对应的作品、动效和提示词。</p>
    </div>
    <div id="direction-grid" class="direction-grid" role="list"></div>
    <section id="direction-detail" class="direction-detail" aria-live="polite" hidden></section>
  </section>

  <section class="toolbar" aria-label="分类、搜索与筛选">
    <nav id="cats" class="cats" role="tablist" aria-label="作品分类">
      <button class="cat" role="tab" data-cat="general" aria-selected="true">综合作品<small></small></button>
      <button class="cat" role="tab" data-cat="women" aria-selected="false">女性人像<small></small></button>
      <button class="cat" role="tab" data-cat="web-ui" aria-selected="false">视觉系 UI<small></small></button>
    </nav>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm10 2-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="搜索标题、提示词或标签…" autocomplete="off" aria-label="搜索作品">
    </div>
    <button id="filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-panel">
      <span class="filter-glyph" aria-hidden="true">☷</span>筛选<span id="filter-count" class="filter-count" hidden>0</span>
    </button>
    <div id="selected-tags" class="selected-tags" role="toolbar" aria-label="已选标签"></div>
    <div id="filter-panel" class="filter-panel" hidden>
      <div class="filter-panel-head">
        <div><strong>筛选作品</strong><span>同组标签为「或」，不同组之间为「且」</span></div>
        <button id="filter-close" class="filter-close" type="button" aria-label="关闭筛选">✕</button>
      </div>
      <label class="filter-search"><span aria-hidden="true">⌕</span><input id="tag-search" type="search" placeholder="搜索标签…" autocomplete="off" aria-label="搜索标签"></label>
      <div id="tag-groups" class="tag-groups"></div>
    </div>
  </section>

  <main>
    <p id="status" class="status" aria-live="polite"></p>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Coolcat · 作品与提示词仅供学习交流 · <a href="https://x.com/aicoolcat" target="_blank" rel="noopener">关注 @aicoolcat</a></p>
  </footer>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <button class="icon-btn modal-close" data-close aria-label="关闭 (Esc)">✕</button>
      <button class="icon-btn nav-btn nav-prev" id="prev" aria-label="上一张 (←)">‹</button>
      <button class="icon-btn nav-btn nav-next" id="next" aria-label="下一张 (→)">›</button>
      <div class="modal-media" id="m-media"></div>
      <aside class="modal-info">
        <h2 id="m-title"></h2>
        <div class="meta" id="m-meta"></div>
        <div class="m-tags" id="m-tags"></div>
        <div class="prompt-block">
          <div class="prompt-head">
            <span>提示词 Prompt</span>
            <button class="copy-btn" id="copy">复制提示词</button>
          </div>
          <pre id="m-prompt"></pre>
        </div>
        <div id="m-extra"></div>
        <div class="modal-actions">
          <button class="ghost-btn" id="share">复制作品链接</button>
        </div>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js"></script>
  <script type="module" src="assets/hero/scene.js"></script>
</body>
</html>
